  if(Number.isNaN(d.getTime()))return false;
  const age=Date.now()-d.getTime();
  return age>=0 && age<3*24*60*60*1000;
}

function sorted(){return [...(DATA.codes||[])].sort((a,b)=>dead(a)!==dead(b)?(dead(a)?1:-1):(dead(a)?new Date(b.expires_at)-new Date(a.expires_at):new Date(a.expires_at)-new Date(b.expires_at)))}
function list(){let a=sorted();return FILTER==="active"?a.filter(x=>!dead(x)):FILTER==="expired"?a.filter(dead):a}
function render(){
 let all=sorted(),act=all.filter(x=>!dead(x)),exp=all.filter(dead);activeCount.textContent=act.length+" 組";expiredCount.textContent=exp.length+" 組";updatedAt.textContent=DATA.generated_at?new Date(DATA.generated_at).toLocaleString("zh-TW"):"未知";
 let a=list(),total=Math.max(1,Math.ceil(a.length/PAGE_SIZE));if(PAGE>total)PAGE=total;let items=a.slice((PAGE-1)*PAGE_SIZE,PAGE*PAGE_SIZE);
 timeline.innerHTML=items.map(c=>`<article class="coupon ${dead(c)?"expired":""}">
<div class="code-line">
  <div class="code-title-wrap">
    <div class="code">${esc(c.code)}</div>
    ${isNew(c)?'<span class="new-badge">NEW</span>':""}
  </div>
  <span class="state">${remain(c)}</span>
</div>
${c.announced?`<div class="announce-date">新增：${esc(announcedDate(c))}</div>`:""}
<div class="deadline">結束：${esc(c.expires_label||"未提供")} · 台灣 ${tw(c.expires_at)}</div>
${c.expiry_conflict?`<div class="conflict">⚠ 兩個資料站的結束日期不同：${(c.expiry_candidates||[]).map(esc).join(" ｜ ")}</div>`:""}
<div class="rewards">${(c.rewards||[]).map(r=>`<span class="reward">${esc(r)}</span>`).join("")}</div>
<div class="source-row"><span class="source-chip">${c.source_count||0} 個資料站確認</span>${(c.sources||[]).map(s=>`<span class="source-chip good">${esc(s.name)}</span>`).join("")}</div>
<div class="actions"><button class="btn copy" onclick="navigator.clipboard.writeText('${c.code}')">複製禮包碼</button><a class="btn primary" target="_blank" href="https://coupon.devplay.com/coupon/cc/en">前往兌換</a></div>
</article>`).join("")||'<div class="quote">目前沒有資料。</div>';
 pagination.classList.remove("hidden");
 pagination.innerHTML=
   `<button class="page-btn" ${PAGE===1?"disabled":""} onclick="if(PAGE>1){PAGE--;render();scrollToList()}">‹ 上一頁</button>`+
   Array.from({length:total},(_,i)=>`<button class="page-btn ${PAGE===i+1?"active":""}" onclick="PAGE=${i+1};render();scrollToList()">${i+1}</button>`).join("")+
   `<button class="page-btn" ${PAGE===total?"disabled":""} onclick="if(PAGE<${total}){PAGE++;render();scrollToList()}">下一頁 ›</button>`;
}
function scrollToList(){
  const el=document.querySelector(".filter-strip");
  if(el)window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-18),behavior:"smooth"});
}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{function scrollToList(){
  const el=document.querySelector(".filter-strip");
  if(el)window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-18),behavior:"smooth"});
}
document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));document.querySelectorAll(`[data-filter="${b.dataset.filter}"]`).forEach(x=>x.classList.add("active"));FILTER=b.dataset.filter;PAGE=1;render()});
async function load(){try{let r=await fetch("data/codes.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;DATA=await r.json()}catch{DATA=FALLBACK}render()}
load();setInterval(load,10*60*1000);setInterval(render,60*1000);
</script>
